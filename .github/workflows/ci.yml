name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # No model downloads in CI: heavy voters are not installed and every one degrades to applicable=False.
      DOUBLESPEAK_OFFLINE: "1"
      DOUBLESPEAK_WARMUP: "0"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LLM_PROVIDER: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: make setup (pinned lockfile)
        run: make setup
      - name: make test
        run: make test
      - name: make eval
        run: make eval
