name: DoublespeakBar
options:
  bundleIdPrefix: dev.doublespeak
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Local signing is passed on the command line (see docs/macos/MENUBAR.md); no team is committed.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  DoublespeakBar:
    type: application
    platform: macOS
    sources:
      - path: DoublespeakBar
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.doublespeak.app.mac
        PRODUCT_NAME: Tell
        # The Swift module keeps its old name so `@testable import Doublespeak` and folder names stay as they are (D-013)
        PRODUCT_MODULE_NAME: Doublespeak
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DoublespeakBar/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO   # it must launch the engine and listener from the repo; see docs/macos/MENUBAR.md
    info:
      path: DoublespeakBar/Info.plist
      properties:
        CFBundleDisplayName: Tell
        CFBundleName: Tell
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSAudioCaptureUsageDescription: "Tell listens to the call audio your Mac plays, only to warn you about scams. The audio is analysed on this Mac and never recorded or sent anywhere."
        NSHumanReadableCopyright: "Tell runs on this Mac only."
  DoublespeakBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DoublespeakBarTests
    dependencies:
      - target: DoublespeakBar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.doublespeak.app.mac.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tell.app/Contents/MacOS/Tell"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DoublespeakBar:
    build:
      targets:
        DoublespeakBar: all
    test:
      targets: [DoublespeakBarTests]
