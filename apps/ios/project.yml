name: Doublespeak
options:
  bundleIdPrefix: dev.doublespeak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your own team to install on a phone (see docs/ios/IOS.md). Empty here on purpose.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Doublespeak:
    type: application
    platform: iOS
    sources:
      - path: Doublespeak
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.doublespeak.app.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Doublespeak/Info.plist
        # Keychain Sharing signs on a free Personal Team; App Groups are rejected there (docs/BLOCK-SPAM.md). On a paid team
        # pass DS_ENTITLEMENTS_APP=Entitlements/App.appgroup.entitlements (and the CallBlocker twin) to use an App Group.
        DS_ENTITLEMENTS_APP: Entitlements/Keychain.entitlements
        CODE_SIGN_ENTITLEMENTS: $(DS_ENTITLEMENTS_APP)
    info:
      path: Doublespeak/Info.plist
      properties:
        CFBundleDisplayName: Doublespeak
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        UIAppFonts: [Outfit-ExtraLight.ttf, Outfit-Light.ttf, Outfit-Regular.ttf, Outfit-Medium.ttf]
        NSMicrophoneUsageDescription: "Doublespeak listens to a call you play out loud near this phone and sends the audio only to your own computer over the USB cable. Nothing is recorded or stored."
        ITSAppUsesNonExemptEncryption: false
        # App Group id the list is shared through. It only takes effect when the build is signed with the
        # appgroup entitlements (docs/BLOCK-SPAM.md); without them the app keeps the list to itself.
        DSAppGroup: group.dev.doublespeak.app.ios
        DSKeychainGroup: $(AppIdentifierPrefix)dev.doublespeak.shared
    dependencies:
      - target: CallBlocker
        embed: true
  CallBlocker:
    type: app-extension
    platform: iOS
    sources:
      - path: CallBlocker
        excludes: ["Info.plist"]
      - path: Doublespeak/Core/BlockList.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.doublespeak.app.ios.CallBlocker
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CallBlocker/Info.plist
        DS_ENTITLEMENTS_EXT: Entitlements/Keychain.entitlements
        CODE_SIGN_ENTITLEMENTS: $(DS_ENTITLEMENTS_EXT)
        SKIP_INSTALL: YES
    info:
      path: CallBlocker/Info.plist
      properties:
        CFBundleDisplayName: Doublespeak Call Blocker
        DSAppGroup: group.dev.doublespeak.app.ios
        DSKeychainGroup: $(AppIdentifierPrefix)dev.doublespeak.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
  DoublespeakTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DoublespeakTests
    dependencies:
      - target: Doublespeak
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.doublespeak.app.ios.tests
schemes:
  Doublespeak:
    build:
      targets:
        Doublespeak: all
    test:
      targets: [DoublespeakTests]
